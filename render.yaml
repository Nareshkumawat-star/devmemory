# Render Blueprint for devmemory
# Docs: https://render.com/docs/blueprint-spec
#
# Deploy: push this file, then in Render click "New +" -> "Blueprint" and pick
# this repo. Secrets marked `sync: false` are NOT stored here; Render prompts
# for them once and keeps them in the dashboard.
#
# The AI layer is configured purely through env vars (see src/lib/env.ts).
# On Render there is no local Ollama, so point GEMMA_API_URL at a hosted
# OpenAI-compatible endpoint instead (e.g. https://openrouter.ai/api/v1).

services:
  - type: web
    name: devmemory
    runtime: node
    # `free` needs NO payment method on the account and draws down none of your
    # credit. It spins down after 15 min idle, so the next request waits ~30-60s.
    # Switching to `starter` ($7/mo, always-on) requires a card on file first,
    # even though the promo credit would cover the bill.
    plan: free
    region: oregon
    branch: main
    # --include=dev is required: NODE_ENV=production makes npm omit
    # devDependencies, but the build needs them (typescript, tailwindcss and
    # @tailwindcss/postcss all live there). Without it the build dies with
    # "Cannot find module '@tailwindcss/postcss'".
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /
    autoDeploy: true
    envVars:
      # Render injects PORT automatically; pinning it matches the default.
      - key: PORT
        value: 10000
      # Render picks a current LTS Node by default. Pin it if you ever need to:
      #   - key: NODE_VERSION
      #     value: 24.11.0
      - key: NODE_ENV
        value: production

      # --- Database (MongoDB Atlas) ---
      # Atlas -> Network Access must allow this service. Either add Render's
      # static egress IPs (Starter plan and above) or 0.0.0.0/0 while testing.
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        sync: false

      # --- Auth ---
      - key: AUTH_SECRET
        generateValue: true
      - key: AUTH_URL
        sync: false

      # --- AI (OpenAI-compatible chat completions endpoint) ---
      # Hosted swap for local Ollama. Only these three change; no code edits.
      - key: GEMMA_API_URL
        sync: false
      - key: GEMMA_API_KEY
        sync: false
      - key: GEMMA_MODEL
        sync: false

      # --- Embeddings (optional) ---
      - key: EMBEDDING_API_URL
        sync: false
      - key: EMBEDDING_API_KEY
        sync: false
      - key: EMBEDDING_MODEL
        sync: false
